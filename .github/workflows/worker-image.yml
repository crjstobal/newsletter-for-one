# Builds the worker image and publishes it to GitHub Container Registry on every change to it.
name: Worker image

on:
  push:
    branches: [main]
    paths: ["lib/**", "scripts/**", "db/**", "Dockerfile", "package*.json"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}-worker:latest
