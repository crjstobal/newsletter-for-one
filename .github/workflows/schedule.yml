# Every 5 days while testing (days 1, 6, 11, 16, 21, 26, 31), launches the worker as a Nebius Serverless AI Job on a small CPU VM. Each
# newsletter has its own delivery days, hour and time zone; the worker writes those whose slot
# has arrived and exits; each issue covers everything since the previous one. In production,
# hourly ("5 * * * *") honors every delivery day and hour.
# Nebius jobs have no built-in schedule, so this cron is the trigger. The VM is billed only
# while the job runs (a few minutes).
#
# Inactive until the repository variable NEBIUS_JOBS_ENABLED is "true". It also needs:
#   variables: NEBIUS_PROJECT_ID, NEBIUS_SA_ID, NEBIUS_PUBLIC_KEY_ID
#   secrets:   NEBIUS_SA_PRIVATE_KEY (PEM), GHCR_TOKEN (read:packages),
#              DATABASE_URL, NEBIUS_API_KEY, TAVILY_API_KEY
name: Scheduled issues

on:
  schedule:
    - cron: "5 6 */5 * *" # 06:05 UTC (08:05 in Madrid) every 5 days
  workflow_dispatch:

jobs:
  launch:
    if: vars.NEBIUS_JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check that GHCR_TOKEN can pull the worker image
        env:
          TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ github.repository }}-worker
        run: |
          # A classic token with read:packages is needed; fine-grained tokens can't read GHCR.
          echo "token prefix: ${TOKEN:0:4}"
          scopes=$(curl -sI -H "Authorization: token $TOKEN" https://api.github.com/user | tr -d '\r' | awk -F': ' 'tolower($1)=="x-oauth-scopes"{print $2}')
          echo "token scopes: ${scopes:-none reported}"
          reg=$(curl -s -u "$OWNER:$TOKEN" "https://ghcr.io/token?scope=repository:$IMAGE:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $reg" -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json" "https://ghcr.io/v2/$IMAGE/manifests/latest")
          echo "manifest status: $code"
          [ "$code" = "200" ] || { echo "::error::GHCR_TOKEN cannot pull ghcr.io/$IMAGE:latest (HTTP $code). Use a classic token with read:packages."; exit 1; }

      - name: Install the Nebius AI Cloud CLI
        run: |
          curl -sSL https://artifacts.nebius.cloud/cli/install.sh | bash
          echo "$HOME/.nebius/bin" >> "$GITHUB_PATH"

      - name: Authenticate as the service account
        env:
          PRIVATE_KEY: ${{ secrets.NEBIUS_SA_PRIVATE_KEY }}
        run: |
          printf '%s' "$PRIVATE_KEY" > "$RUNNER_TEMP/sa.pem"
          nebius profile create \
            --profile ci \
            --endpoint api.nebius.cloud \
            --service-account-id "${{ vars.NEBIUS_SA_ID }}" \
            --public-key-id "${{ vars.NEBIUS_PUBLIC_KEY_ID }}" \
            --private-key-file "$RUNNER_TEMP/sa.pem" \
            --parent-id "${{ vars.NEBIUS_PROJECT_ID }}"
          rm "$RUNNER_TEMP/sa.pem"

      - name: Launch the worker job
        run: |
          nebius ai job create \
            --profile ci \
            --name "nfo-worker-${{ github.run_id }}" \
            --image "ghcr.io/${{ github.repository }}-worker:latest" \
            --registry-username "${{ github.repository_owner }}" \
            --registry-password "${{ secrets.GHCR_TOKEN }}" \
            --platform cpu-d3 \
            --preset 2vcpu-8gb \
            --disk-size 20Gi \
            --timeout 1h \
            --env "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --env "NEBIUS_API_KEY=${{ secrets.NEBIUS_API_KEY }}" \
            --env "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}" \
            --env "DAILY_CAP_EUR=5" \
            --async
